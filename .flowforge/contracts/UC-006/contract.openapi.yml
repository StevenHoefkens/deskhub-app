openapi: "3.0.3"
info:
  title: "List my reservations"
  version: "1.0.0"

servers:
  - url: /api
    description: "DeskHub API gateway"

paths:
  /reservations:
    get:
      operationId: "listMyReservations"
      summary: "List the authenticated employee's own active and upcoming reservations (desks and rooms)"
      tags:
        - "reservation"
      security:
        - sessionCookie: []
      responses:
        "200":
          description: "The caller's reservations (may be empty)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyReservations"
        "401":
          description: "No valid session — the caller is unauthenticated (UNAUTHENTICATED) or the session has expired (SESSION_EXPIRED)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: DESKHUB_SESSION
      description: "DeskHub session cookie set after SSO login (UC-001). Required for all authenticated operations."
  schemas:
    # --- Response Schema (the success data body, camelCase, unwrapped) ---
    MyReservations:
      type: object
      required:
        - reservations
      properties:
        reservations:
          type: array
          description: "The caller's active and upcoming reservations across resource types (desks and rooms); empty when none"
          items:
            $ref: "#/components/schemas/ReservationSummary"

    # A resource-agnostic reservation row. `resourceType` discriminates the two
    # projections: desk rows carry deskId/zoneId/granularity/checkInState; room
    # rows carry roomId/startsAt/endsAt and have no check-in state. Fields common
    # to both (id, resourceType, floor, date, status) are required.
    ReservationSummary:
      type: object
      required:
        - id
        - resourceType
        - floor
        - date
        - status
      properties:
        id:
          type: string
          format: uuid
          example: "b2c4a1e0-7f3d-4a9b-8c11-0d2e5f6a7b8c"
        resourceType:
          type: string
          description: "Which kind of resource this reservation is for"
          enum:
            - desk
            - room
          example: "desk"
        floor:
          type: string
          description: "Floor label (may be negative, e.g. -1)"
          example: "2"
        date:
          type: string
          format: date
          example: "2026-07-27"
        status:
          type: string
          enum:
            - active
            - cancelled
            - no_show
          example: "active"
        deskId:
          type: string
          description: "Desk identifier — present when resourceType is desk"
          example: "desk-2b-014"
        zoneId:
          type: string
          description: "Zone of the desk — present when resourceType is desk"
          example: "zone-2b"
        granularity:
          $ref: "#/components/schemas/Granularity"
        checkInState:
          type: string
          description: "Check-in flag — present only when resourceType is desk; room reservations have no check-in state"
          enum:
            - not_checked_in
            - checked_in
          example: "not_checked_in"
        roomId:
          type: string
          description: "Room identifier — present when resourceType is room"
          example: "room-3-201"
        startsAt:
          type: string
          format: date-time
          description: "Inclusive start of the reserved slot range — present when resourceType is room"
          example: "2026-07-27T10:00:00+02:00"
        endsAt:
          type: string
          format: date-time
          description: "Exclusive end of the reserved slot range — present when resourceType is room"
          example: "2026-07-27T11:00:00+02:00"

    Granularity:
      type: string
      description: "Booking granularity — a full day, or the morning or afternoon half-day"
      enum:
        - FULL_DAY
        - MORNING
        - AFTERNOON
      example: "FULL_DAY"

    # --- Error Body Schema (STD-001) ---
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: "Machine-readable error code (SCREAMING_SNAKE_CASE — STD-002). One of: SESSION_EXPIRED, UNAUTHENTICATED."
          example: "SESSION_EXPIRED"
        message:
          type: string
          description: "Human-readable message, safe to display to end users"
          example: "Your session has expired. Please sign in again."
