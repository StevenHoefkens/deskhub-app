openapi: "3.0.3"
info:
  title: "Search available rooms"
  version: "1.0.0"

servers:
  - url: /api
    description: "DeskHub API gateway"

paths:
  /rooms:
    get:
      operationId: "searchAvailableRooms"
      summary: "Search rooms available for a date and 15-minute slot range, filtered by capacity and tags"
      tags:
        - "reservation"
      security:
        - sessionCookie: []
      parameters:
        - name: date
          in: query
          required: true
          description: "Search date; the slot range must not be in the past. No upper horizon."
          schema:
            type: string
            format: date
          example: "2026-07-27"
        - name: startTime
          in: query
          required: true
          description: "Inclusive start of the slot range, aligned to a 15-minute boundary (:00, :15, :30, :45)"
          schema:
            type: string
            pattern: "^([01][0-9]|2[0-3]):(00|15|30|45)$"
          example: "10:00"
        - name: endTime
          in: query
          required: true
          description: "Exclusive end of the slot range, aligned to a 15-minute boundary and strictly after startTime"
          schema:
            type: string
            pattern: "^([01][0-9]|2[0-3]):(00|15|30|45)$"
          example: "11:00"
        - name: minCapacity
          in: query
          required: false
          description: "Minimum maximum-capacity a room must meet or exceed"
          schema:
            type: integer
            minimum: 1
          example: 6
        - name: tags
          in: query
          required: false
          description: "Facility tag filters; a room must carry ALL supplied tags (AND semantics)"
          schema:
            type: array
            items:
              type: string
          example:
            - "beamer"
            - "video-conference"
      responses:
        "200":
          description: "Search results (may be empty)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomSearchResults"
        "400":
          description: "Validation error — date/range in the past, or a range not aligned to 15-minute boundaries"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: DESKHUB_SESSION
      description: "DeskHub session cookie set after SSO login (UC-001). Required for all authenticated operations."
  schemas:
    # --- Response Schema (the success data body, camelCase, unwrapped) ---
    RoomSearchResults:
      type: object
      required:
        - date
        - startTime
        - endTime
        - rooms
      properties:
        date:
          type: string
          format: date
          example: "2026-07-27"
        startTime:
          type: string
          example: "10:00"
        endTime:
          type: string
          example: "11:00"
        rooms:
          type: array
          description: "Rooms available for the full requested range matching the filters; empty when none match"
          items:
            $ref: "#/components/schemas/AvailableRoom"

    AvailableRoom:
      type: object
      required:
        - roomId
        - floor
        - maxCapacity
        - tags
      properties:
        roomId:
          type: string
          example: "room-3-201"
        floor:
          type: string
          description: "Floor label (may be negative, e.g. -1)"
          example: "3"
        maxCapacity:
          type: integer
          description: "Maximum capacity of the room; informational (shown and filterable), not enforced at booking"
          example: 8
        tags:
          type: array
          items:
            type: string
          example:
            - "beamer"
            - "video-conference"

    # --- Error Body Schema (STD-001) ---
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: "Machine-readable error code (SCREAMING_SNAKE_CASE — STD-002). One of: INVALID_DATE, INVALID_SLOT_RANGE."
          example: "INVALID_SLOT_RANGE"
        message:
          type: string
          description: "Human-readable message, safe to display to end users"
          example: "Times must fall on 15-minute boundaries (:00, :15, :30, :45)."
        details:
          type: array
          description: "Field-level validation errors (HTTP 400 — STD-001 Rule 8)"
          items:
            type: object
            required:
              - field
              - rule
              - message
            properties:
              field:
                type: string
                example: "startTime"
              rule:
                type: string
                example: "alignment"
              message:
                type: string
                example: "Times must fall on 15-minute boundaries (:00, :15, :30, :45)."
